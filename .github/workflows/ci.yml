name: CI
on:
  schedule:
    - cron: 0 0 * * 1
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - "**"
    tags: "*"
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.10"
          - "1.11"
          - "1.12"
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: actions/cache@v5
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('test/Artifacts.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      # Artifacts alone do not avoid the 20–36 minute dependency precompile
      # seen on macOS. Preserve compiled packages separately; include the
      # matrix and architecture, and leave cache deletion permissions off.
      - uses: julia-actions/cache@v3
        with:
          cache-name: compiled-tests-${{ runner.arch }}
          cache-artifacts: false
          cache-registries: false
          delete-old-caches: false
      - uses: julia-actions/julia-buildpkg@v1
      - name: Download and verify reference fixtures
        run: julia --startup-file=no test/download_fixtures.jl
      # Work around Julia 1.10 parallel-precompilation hangs in the large
      # test environment. Julia 1.11 and 1.12 retain parallel precompilation.
      - name: Serialize test precompilation on Julia 1.10
        if: matrix.version == '1.10'
        shell: bash
        run: echo 'JULIA_NUM_PRECOMPILE_TASKS=1' >> "$GITHUB_ENV"
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.version == '1.12' && matrix.os == 'ubuntu-latest' }}
          # JET 0.12 requires Julia >=1.12. Older runtimes must retain a valid
          # older JET, including on future CompatHelper branches.
          force_latest_compatible_version: ${{ matrix.version == '1.12' && 'auto' || 'false' }}
          # These arguments assert versions; they do not select a reduced suite.
          test_args: ${{ matrix.version == '1.12' && 'require-jet-012 require-datainterpolations-10' || '' }}
      # Only process and upload coverage once, on the latest Julia release job
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        with:
          directories: src,ext
      - uses: codecov/codecov-action@v5
        if: matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
  lower-bounds:
    name: Lowest compatible dependencies - Julia 1.12 - ${{ github.event_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # Julia >=1.12 supports the locked Pkg.test environment used here.
      # The ordinary matrix above separately checks older Julia runtimes.
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: actions/cache@v5
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-lower-bounds-artifacts-${{ hashFiles('test/Artifacts.toml') }}
          restore-keys: |
            ${{ runner.os }}-lower-bounds-artifacts-
            ${{ runner.os }}-test-cache-artifacts-
      # Resolve a jointly compatible minimum, including optional extensions.
      # v2.7.0 also locks [extras]/[targets].test by promoting resolved test
      # dependencies in this disposable checkout; do not exclude any backend.
      - name: Preserve original dependency declarations
        run: cp Project.toml lower-bounds-original-Project.toml
      - name: Resolve lowest compatible dependencies
        uses: julia-actions/julia-downgrade-compat@30b83cf94e89744fcbd7ea5496be4967d6fbe540 # v2.7.0
        with:
          projects: '.'
          mode: alldeps
          julia_version: '1.12'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Record resolved dependency versions
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)'
      - name: Download and verify reference fixtures
        run: julia --startup-file=no test/download_fixtures.jl
      - name: Test the locked lower-bound environment
        uses: julia-actions/julia-runtest@v1
        env:
          ACE_TEST_ORIGINAL_PROJECT: ${{ github.workspace }}/lower-bounds-original-Project.toml
        with:
          coverage: false
          allow_reresolve: false
          force_latest_compatible_version: false
          # No latest-version assertions or reduced-suite test_args here.
      - name: Preserve lower-bound resolution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lower-bounds-environment-${{ github.event_name }}
          path: |
            Project.toml
            Manifest.toml
            lower-bounds-original-Project.toml
          if-no-files-found: warn
